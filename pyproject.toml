[project]
name = "msc-thesis-stock-forecasting"
version = "0.1.0"
description = "Thesis project code (not packaged)"
authors = [
    { name = "Dimitris", email = "zinodimitris@gmail.com" },
]
requires-python = ">=3.11,<3.12"

# Common dependencies that both models share
dependencies = [
    "pmdarima>=2.0.4,<3.0.0",
    "matplotlib>=3.9.2,<4.0.0",
    "pyaml>=25.5.0,<26.0.0",
    "pandas>=2.2.3,<3.0.0",
    "tqdm>=4.66.3,<5.0.0",
    "yfinance>=0.2.61,<0.3.0",
    "numpy==1.26.4",
    "alpaca-py>=0.29.2,<1.0.0",
]

[project.optional-dependencies]
# Dependencies exclusively for the Chronos model
chronos = [
    "chronos-forecasting>=1.5.2,<2.0.0",
    "transformers>=4.48.0,<5.0.0", # The newer version Chronos needs
]

# Dependencies exclusively for the Sundial model
sundial = [
    # "sundial-package-name", # Add the actual sundial package here
    "transformers==4.40.1", # The specific older version Sundial needs
]

times = [
    "timesfm[torch]>=1.2.9,<2.0.0; sys_platform == 'linux'",
]
# Development tools
dev = [
    "jupyter>=1.0",
    "black>=24.0",
    "python-dotenv>=1.0.0",
]

# Add this new section below to guide the builder
[tool.setuptools.packages.find]
exclude = [
    "data*",
    "tables*",
    "results*",
    "figures*",
    "configs*",
    "notebooks*",
    "*_env",  # Using a pattern to exclude sundial_env, chronos_env, etc.
]

